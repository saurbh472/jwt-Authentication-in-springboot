spring.application.name=Jwt-Authentication-SpringBoot-Stable-1

server.port=8082
 
#Mysql Configuration
#Spring JPA
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/authentication?allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
 
#Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.thymeleaf.check-template-location=false
spring.jpa.open-in-view=false
spring.datasource.tomcat.test-while-idle=true
spring.datasource.tomcat.time-between-eviction-runs-millis=1800000
spring.datasource.tomcat.validation-query=SELECT 1
 
#Jwt Configuration
jwt.expirationDateInMs=24000000
jwt.refreshExpirationDateInMs=26297460
jwt.secret = ZmAnN71qRH
spring.datasource.initialization-mode=always
